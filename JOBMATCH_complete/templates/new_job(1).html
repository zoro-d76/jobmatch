{% extends "base.html" %}{% block title %}Post a job{% endblock %}{% block content %}<div class="narrow-form"><div class="eyebrow">EMPLOYER WORKSPACE</div><h1>Post an <span>opportunity.</span></h1><p class="muted">Describe the role and the skills your team needs.</p><form method="post" class="form card-form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Job title<input name="title" required></label><label>Description<textarea name="description" rows="5" required></textarea></label><label>Required skills <small>Comma-separated</small><input name="skills" required></label><div class="form-two"><label>Experience (years)<input type="number" name="experience" min="0" required></label><label>Location<input name="location" required></label></div><label>Salary offered<input type="number" name="salary" min="0" required></label><button class="btn btn-primary btn-full">Publish vacancy ↗</button></form></div>{% endblock %}
